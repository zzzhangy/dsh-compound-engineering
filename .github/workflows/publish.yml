name: publish

# 打 tag 即发版（例如 `git tag v0.1.2 && git push origin v0.1.2`）。
#
# 为什么走这条路而不是在本地 `npm publish`：
#   1. 本地发布要浏览器 OTP 授权，每次都得人工点一下；
#   2. npm 正在淘汰 bypass-2FA token 的直接发布能力（2027 年 1 月移除），
#      而 bypass token 又会强制走 staged publishing，首发新包时会产生
#      0.0.0-stage 占位包并卡住（本项目踩过）；
#   3. OIDC 发布自带 provenance 证明，且不需要在仓库里存任何长期 token。
#
# 首次使用前，需要去 npmjs.com 把仓库登记为 Trusted Publisher：
#   https://www.npmjs.com/package/dsh-compound-engineering/access
#   → Trusted Publishing → 填 GitHub 用户/仓库名、workflow 文件名 publish.yml
# 注意 workflow 文件名必须与 npm 后台填写的一致，否则 OIDC 校验会失败。

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 换 npm 凭据必需
    steps:
      - uses: actions/checkout@v4

      # Node 24 自带 npm 11.x，满足 trusted publishing 的版本要求。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 校验 tag 与 package.json 版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME 与 package.json 的 $pkg 不一致，中止发布" >&2
            exit 1
          fi

      # CHANGELOG 是用户判断「该不该升级」的唯一依据，缺失就等于没写发版说明。
      # 要求本版本有标题形如 `## [0.1.5]`（方括号可省）且该行不含「未发布」。
      - name: 校验 CHANGELOG 有本版本条目
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ ! -f CHANGELOG.md ]; then
            echo "缺少 CHANGELOG.md，中止发布" >&2
            exit 1
          fi
          line="$(grep -nE "^## \[?${version//./\\.}\]?" CHANGELOG.md | head -1)"
          if [ -z "$line" ]; then
            echo "CHANGELOG.md 里找不到 ## [${version}] 这一节，中止发布。" >&2
            echo "请在 CHANGELOG.md 顶部为 ${version} 补一节改动说明。" >&2
            exit 1
          fi
          if printf '%s' "$line" | grep -q '未发布\|Unreleased'; then
            echo "CHANGELOG.md 的 ${version} 一节仍标着「未发布」，请改为实际日期。" >&2
            exit 1
          fi
          echo "CHANGELOG 校验通过：${line}"

      # 本项目的 test:py 调的是 `python`，而 ubuntu runner 默认只有 python3。
      - name: 确保 python 命令可用
        run: |
          if ! command -v python >/dev/null 2>&1; then
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python
          fi
          python --version

      - name: 跑测试
        run: npm test

      # 注意：不能用 `npm pack --dry-run 2>&1 | grep` 判断，
      # prepack 钩子的日志本身就会打印 “清理了 N 个 __pycache__ 目录”，
      # grep 会把日志当成命中而误报失败。这里解析 --json 的文件清单。
      # 另外 prepack 的 stdout 会混进 JSON 之前，所以按行首的 `[` 定位数组起点。
      - name: 确认打包结果里没有 __pycache__
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const raw = require("fs").readFileSync("pack.json", "utf8");
            const m = raw.match(/^\[$/m);
            if (!m) { console.error("无法定位 pack 输出里的 JSON 数组"); process.exit(1); }
            const files = JSON.parse(raw.slice(m.index))[0].files.map((f) => f.path);
            const bad = files.filter((p) => /__pycache__|\.pyc$/.test(p));
            console.log(`打包文件数: ${files.length}`);
            if (bad.length) {
              console.error("发布包混入 Python 缓存：\n" + bad.join("\n"));
              process.exit(1);
            }
            console.log("未发现 Python 缓存文件");
          '
          rm -f pack.json

      # --provenance 会生成 attestation；OIDC 已由 setup-node 的 registry-url 启用。
      - name: 发布到 npm
        run: npm publish --provenance --access public
